  f0_d00_forward:
    description: "A person walks forward"
    prompt: "A person walks forward."
    duration: [8.0, 8.0]
    styles: []
    torso_height: [0.77, 0.77]
    vel_cmd: {vx: [0.0, 0.0], vy: [0.0, 0.0], wz: [0.0, 0.0]}
