# DATA-KIMODO-VELOCITY-DISTRIBUTION-009 — CANARY gate config.
# 16 motions = 8 directions x {slow [0.1,0.2], fast [1.2,1.5]}.
# Same prompt_speed_bands as the full config; direction_deg = group
# center +/- 15 deg (native compass: +90 left, -90 right).
# Canary verifies from qpos: (a) traveled direction matches prompt,
# (b) endpoint speed within the intended band, (c) naturalness (HHOP).
global:
  model: kimodo-g1-rp
  diffusion_steps: 100
  seed: 20260807
  fps: 30
  output_dir: /data/masteryip/kimodo/datasets/DATA-KIMODO-VELOCITY-DISTRIBUTION-009/canary_raw
  sampling_method: uniform
  rerank: ''
  export_preset: rltracker
  cfg_type: separated
  cfg_weight:
  - 2.0
  - 2.0
motion_types:
  d00_forward_slow:
    description: A person walks forward.
    duration:
    - 8.0
    - 8.0
    vel_cmd:
      polar:
        speed:
        - 0.1
        - 0.2
        direction_deg:
        - -15.0
        - 15.0
      wz:
      - 0.0
      - 0.0
    torso_height:
    - 0.77
    - 0.77
    styles: []
    prompt_speed_bands: &id001
    - - 0.15
      - A person stands still.
    - - 0.45
      - A person walks slowly forward.
    - - 0.85
      - A person walks forward.
    - - 1.2
      - A person walks briskly forward.
    - - 1.51
      - A person jogs forward.
    num_samples: 1
  d00_forward_fast:
    description: A person walks forward.
