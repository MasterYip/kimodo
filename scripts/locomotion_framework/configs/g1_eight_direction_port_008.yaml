# DATA-KIMODO-FRAMEWORK-PORT-008 — reproduce the DISTRIBUTED-007 40-motion
# distributed Root2D envelope through the native locomotion_framework.
#
# FROZEN DESIGN (see DISTRIBUTED-007 factor_map.md): seed 20260805,
# 8 s / 240 f / 30 fps / 100 diffusion steps, separated CFG [2.0, 2.0],
# model kimodo-g1-rp.  Sample names f{cell}_{direction}_s20260805.
#
# Geometry parity mechanism (documented in the task design note):
#   E0 text-only x8 (vel zero -> no Root2D constraint)
#   E1 straight dense x8 (framework velocity builder, stride 1)
#   E2 curved stride-8 x8 (constraint_path -> native E2 JSON verbatim; the
#      framework's arc builder uses a different kinematic model and cannot
#      reproduce the native turning arcs)
#   E3 waypoint 3-keyframe x8 (constraint_path -> native E3 JSON verbatim)
#   E4 straight dense + heading x8 (framework velocity builder + emit_heading
#      True + heading_deg = native natural-facing angle)
global:
  model: kimodo-g1-rp
  diffusion_steps: 100
  seed: 20260805
  fps: 30
  output_dir: outputs/framework_port_008_raw
  sampling_method: uniform
  export_preset: rltracker
  cfg_type: separated
  cfg_weight: [2.0, 2.0]
  rerank: ""
