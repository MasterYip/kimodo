# =============================================================================
# DATA-KIMODO-TORSO-HEIGHT-DISTRIBUTION-013 — CANARY gate config.
# 32 motions = 8 directions x 4 2-D corners:
#   (slow ~0.11, torso ~0.455)   (fast ~1.45, torso ~0.455)
#   (slow ~0.11, torso ~0.775)   (fast ~1.45, torso ~0.775)
# Same prompt_speed_bands + torso-hint composition as the full config;
# direction_deg = group centre +/- 15 deg (native compass: +90 left, -90 right).
# Canary verifies from qpos: (a) traveled direction matches prompt,
# (b) ACHIEVED root/pelvis height differs from neutral and spreads across
# [0.45, 0.8] (make-or-break: model must respond to the torso text signal),
# (c) naturalness (HHOP low, head_z > 0.2 m, checked on the local FK).
