# Human-review batch derived from the accepted 24-motion constraint matrix.
# Polar convention: 0 deg forward (+vx), +90 deg right (+vy).
# Eight direction sectors x three LHS speed samples = 24 motions.
global:
  model: kimodo-g1-rp
  diffusion_steps: 100
  seed: 20260806
  fps: 30
  output_dir: /data/masteryip/kimodo/datasets/20260806_DATA-KIMODO-POLAR-DISTRIBUTION-006/polar_direction_speed_24
  sampling_method: lhs
  rerank: speed
  export_preset: rltracker

motion_types:
  d00_forward:
    description: "A person walks forward naturally"
    duration: [8.0, 8.0]
    vel_cmd:
      polar:
        speed: [0.35, 0.85]
        direction_deg: [-15.0, 15.0]
      wz: [0.0, 0.0]
    torso_height: [0.77, 0.77]
    styles: []
    num_samples: 3

  d01_forward_right:
