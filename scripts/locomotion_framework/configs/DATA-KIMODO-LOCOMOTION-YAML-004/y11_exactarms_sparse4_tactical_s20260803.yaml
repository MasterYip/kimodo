global:
  model: kimodo-g1-rp
  diffusion_steps: 100
  seed: 20260803
  fps: 30
  output_dir: /data/masteryip/kimodo/datasets/DATA-KIMODO-LOCOMOTION-YAML-004/directional_arms_20260805_raw/y11_exactarms_sparse4_tactical_s20260803
  sampling_method: uniform
  export_preset: rltracker
  root2d_constraint:
    enabled: true
    stride: 4

motion_types:
  forward:
    description: "A person walks forward"
    prompt: "A person walks forward slightly crouching with natural alternating forward and backward arm swing."
    duration: [8.0, 8.0]
    vel_cmd:
      vx: [0.50, 0.50]
      vy: [0.0, 0.0]
      wz: [0.0, 0.0]
    torso_height: [0.69, 0.69]
    styles: []
    num_samples: 1
  right:
    description: "A person walks to the right"
    prompt: "A person walks to the right slightly crouching with natural alternating left and right arm swing and slight fore-aft clearance."
    duration: [8.0, 8.0]
    vel_cmd:
      vx: [0.0, 0.0]
      vy: [0.35, 0.35]
      wz: [0.0, 0.0]
    torso_height: [0.69, 0.69]
    styles: []
    num_samples: 1
