# =============================================================================
# G1 Normal Locomotion — DEBUG / TEST config
#
# Reduced sample counts (10 per type, 40 total) for fast iteration during
# joint-mapping debugging.  LHS ensures even coverage of all 5 continuous
# dimensions (duration, vx, vy, wz, torso_height) despite small N.
#
# Usage:
#   cd /data/masteryip/kimodo/kimodo/scripts && source ./env.sh
#   PYTHONPATH=. python3 -m locomotion_framework.orchestrator \
#       -c locomotion_framework/configs/g1_normal_loco_debug.yaml \
#       --preset rltracker -o /data/masteryip/kimodo/kimodo/outputs/normal_loco_test2
# =============================================================================

global:
  model: kimodo-g1-rp
  diffusion_steps: 100
  seed: 42
  output_dir: outputs/normal_loco_test2
  sampling_method: lhs          # Latin Hypercube for max coverage per sample
  export_preset: rltracker

motion_types:
  # ── Walk — full directional / speed coverage ────────────────────
  walk:
    description: "a robot walks"
    duration: [5.0, 8.0]
    vel_cmd:
      vx: [-0.60, 0.80]
      vy: [-0.40, 0.40]
      wz: [-0.50, 0.50]
    torso_height: [0.60, 0.85]
    styles:
      - "normally"
      - "at a steady pace"
    weight: 0.50
    num_samples: 10

  # ── Run ─────────────────────────────────────────────────────────
  run:
    description: "a robot runs"
    duration: [5.0, 8.0]
    vel_cmd:
      vx: [0.80, 2.00]
      vy: [-0.10, 0.10]
      wz: [-0.15, 0.15]
    torso_height: [0.60, 0.80]
    styles:
      - "normally"
      - "steadily"
    weight: 0.20
    num_samples: 10

  # ── Stand ───────────────────────────────────────────────────────
  stand:
    description: "a robot stands still"
    duration: [5.0, 8.0]
    vel_cmd:
      vx: [-0.02, 0.02]
      vy: [-0.02, 0.02]
      wz: [-0.02, 0.02]
    torso_height: [0.70, 0.90]
    styles:
      - "idle"
      - "at rest"
    weight: 0.15
    num_samples: 10

  # ── Squat ───────────────────────────────────────────────────────
  squat_move:
    description: "a robot squats and moves"
    duration: [5.0, 8.0]
    vel_cmd:
      vx: [-0.20, 0.30]
      vy: [-0.10, 0.10]
      wz: [-0.20, 0.20]
    torso_height: [0.35, 0.55]
    styles:
      - "normally"
      - "while staying low"
    weight: 0.15
    num_samples: 10
